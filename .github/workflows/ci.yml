name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: bun run test
      - run: bun run build

  typecheck:
    # Hard type-check gate. As of commit 599485d9 (2026-04-09) the
    # TS strict-mode baseline for modules/ui-classic is 0 AND
    # `transpileOnly: true` has been dropped from webpack.config.js,
    # so webpack's ts-loader now does real type-checking at bundle
    # time. This job is the explicit standalone gate: `tsc --noEmit`
    # must exit 0. Any error — even one — fails CI.
    #
    # The .typescript-baseline file is retained at 0 as a visible
    # assertion / documentation anchor; the job verifies the file
    # says 0 and that tsc agrees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (for kdbxweb type resolution)
        # modules/ui-classic imports 'kdbxweb' (symlinked to modules/db).
        # Without dist/types/, tsc can't find the module. Locally the
        # types are present from prior builds but CI starts clean.
        run: cd modules/db && bun run build
      - name: Run tsc --noEmit on modules/ui-classic (hard fail on any error)
        run: cd modules/ui-classic && bunx tsc --noEmit
      - name: Type-check New UI and shared vault
        run: |
          cd modules/ui
          bunx tsc --noEmit
          bunx tsc --noEmit -p ../vault/tsconfig.json
      - name: Type-check webpack loaders (JSDoc, checkJs)
        run: cd modules/ui-classic && bunx tsc -p tsconfig.build.json
      - name: Type-check the service worker (WebWorker lib)
        run: cd modules/ui-classic && bunx tsc -p app/sw/tsconfig.json
      - name: Enforce baseline sentinel is still 0
        run: |
          cd modules/ui-classic
          BASELINE=$(cat .typescript-baseline | tr -d '[:space:]')
          if [ "$BASELINE" != "0" ]; then
            echo "::error title=TS baseline sentinel drifted::modules/ui-classic/.typescript-baseline must remain at 0. Got: $BASELINE. See Phase 1 TS migration closeout in 599485d9."
            exit 1
          fi

  e2e-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: cd modules/extension && bun run build-chrome
      - run: cd modules/extension && bunx playwright install chromium --with-deps
      - run: sudo apt-get install -y xvfb
      - name: Extension E2E (Playwright headed + xvfb)
        run: cd modules/extension && xvfb-run bunx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-extension-report
          path: |
            modules/extension/test-results/
            modules/extension/playwright-report/
          retention-days: 7

  e2e-full-chain-chromium:
    # Full-chain autofill regression guard for Chromium. Drives the
    # COMPLETE runCommand chain via chrome.action.onClicked.dispatch
    # (a public chrome.events.Event API), including the encrypted
    # backend.getLogins round-trip that was broken by the 2026-04-09
    # nonce-aliasing bug. Runs against real github.com/login.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (webpack dev server needs kdbxweb dist)
        # modules/ui-classic webpack aliases `kdbxweb` → modules/db/dist.
        # Without this build step the dev server fails to compile with
        # "Can't resolve 'kdbxweb'" across ~20 files. Same root cause as
        # the typecheck job's missing-types issue, different layer.
        run: cd modules/db && bun run build
      - run: cd modules/extension && bun run build-chrome
      - run: bunx playwright install chromium --with-deps
      - run: sudo apt-get install -y xvfb
      - name: Full-chain chromium E2E
        run: xvfb-run bunx playwright test --config playwright.config.ts --project=extension e2e/extension/autofill-full-chain.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-full-chain-chromium-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-full-chain-firefox:
    # Full-chain autofill regression guard for Firefox. Uses Selenium
    # + geckodriver because Playwright's bundled Firefox enforces xpi
    # signature verification (our dev xpi is unsigned). Drives
    # runCommand via the `invoke-action-click` runtime message RPC
    # from the extension options page (Firefox does not expose
    # chrome.action.onClicked.dispatch like Chromium does).
    #
    # Runner: ubuntu-latest (24.04 noble) REMOVED firefox from apt
    # — only the snap is available, which doesn't work inside
    # containerized CI. We install Firefox + geckodriver via binary
    # downloads instead, which gives us a pinned Firefox version for
    # reproducibility (ci drift in browser-version would otherwise
    # surface as test flakiness).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (webpack dev server needs kdbxweb dist)
        # modules/ui-classic webpack aliases `kdbxweb` → modules/db/dist.
        # Without this the dev server fails with "Can't resolve 'kdbxweb'".
        run: cd modules/db && bun run build
      - run: cd modules/extension && bun run build-firefox
      - name: Install Firefox + geckodriver (pinned binary download)
        run: |
          set -euxo pipefail
          # Firefox — pin a specific version for CI reproducibility.
          # Update periodically in coordination with the local dev
          # environment (local runs Firefox 149).
          FIREFOX_VERSION=149.0.2
          wget -q "https://download.mozilla.org/?product=firefox-${FIREFOX_VERSION}&os=linux64&lang=en-US" -O firefox.tar.xz
          tar -xf firefox.tar.xz
          sudo mv firefox /opt/firefox
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          firefox --version
          # geckodriver — pinned release.
          GECKO_VERSION=v0.36.0
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-linux64.tar.gz" -O geckodriver.tar.gz
          tar -xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
          # Firefox deps (libdbus-glib, etc) — install what's actually
          # needed for headless Firefox on ubuntu-noble.
          sudo apt-get update
          sudo apt-get install -y libdbus-glib-1-2 libgtk-3-0 libasound2t64
      - name: Start KeeWebX dev server
        run: |
          bun run --filter @keewebx/ui-classic dev > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8085 > /dev/null; then
              echo "dev server ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Full-chain firefox E2E
        env:
          HEADLESS: '1'
          KEEWEBX_URL: http://localhost:8085/
        run: bun run e2e/extension/autofill-firefox-full-chain.mjs
      - name: Dump dev server log on failure
        if: failure()
        run: cat /tmp/dev-server.log || true

  e2e-new-interface-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KEEWEBX_NEW_EXTENSION: '1'
      KEEWEBX_E2E_PORT: '8097'
      KW_E2E_APP_ORIGIN: http://localhost:8097
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/new-interface-connect
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build the app with New extension connections enabled
        run: bun run build
      - name: Build both extension packages
        working-directory: modules/extension
        run: |
          bun run build-chrome
          bun run build-chrome-vault
      - name: Install full headless Chromium
        run: bunx playwright install chromium --with-deps
      - name: Test real New and Classic extension connections
        run: |
          set -euo pipefail
          mkdir -p .cache
          bun e2e/serve-app.ts > .cache/new-interface-connect-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8097/next.html > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .cache/new-interface-connect-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8097/next.html > /dev/null
          bunx playwright test --config e2e/extension/new-interface.playwright.config.ts e2e/extension/new-interface-connection.spec.ts --reporter=line,html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-new-interface-connect-report
          path: |
            e2e/test-results-new-extension/
            playwright-report/new-interface-connect/
            .cache/new-interface-connect-server.log
          retention-days: 7
