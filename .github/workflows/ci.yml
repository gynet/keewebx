name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only the newest commit on a branch needs to finish acceptance.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Playwright 1.59 supports Ubuntu 24.04; keep browser runners off moving latest.
  e2e-embedded-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      KEEWEBX_NEW_EXTENSION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the packaged vault extension
        run: cd modules/extension && bun run build-chrome-vault
      - run: bunx playwright install chromium --with-deps
      - name: Verify embedded New, Classic and Connect workflows
        run: bunx playwright test --config e2e/extension/vault.playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-embedded-vault
          path: e2e/test-results-vault/
          retention-days: 7

  e2e-registered-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install ${{ matrix.browser }} --with-deps
      - name: Build registered storage test fixture
        run: ./modules/ui/node_modules/.bin/webpack --config e2e/providers/webpack.config.cjs --mode production
      - name: Verify registered storage browsing and cancellation
        run: bunx playwright test --config e2e/providers/playwright.config.ts --project=${{ matrix.browser }}
      - name: Verify encrypted provider backups and interrupted writes
        run: bunx playwright test --config e2e/backup/playwright.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-registered-storage-${{ matrix.browser }}
          path: |
            test-results/
            .cache/backup/results/
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: bun run test
      - run: bun run build

  typecheck:
    # Hard type-check gate. As of commit 599485d9 (2026-04-09) the
    # TS strict-mode baseline for modules/ui-classic is 0 AND
    # `transpileOnly: true` has been dropped from webpack.config.js,
    # so webpack's ts-loader now does real type-checking at bundle
    # time. This job is the explicit standalone gate: `tsc --noEmit`
    # must exit 0. Any error — even one — fails CI.
    #
    # The .typescript-baseline file is retained at 0 as a visible
    # assertion / documentation anchor; the job verifies the file
    # says 0 and that tsc agrees.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (for kdbxweb type resolution)
        # modules/ui-classic imports 'kdbxweb' (symlinked to modules/db).
        # Without dist/types/, tsc can't find the module. Locally the
        # types are present from prior builds but CI starts clean.
        run: cd modules/db && bun run build
      - name: Run tsc --noEmit on modules/ui-classic (hard fail on any error)
        run: cd modules/ui-classic && bunx tsc --noEmit
      - name: Type-check New UI and shared vault
        run: |
          cd modules/ui
          bunx tsc --noEmit
          bunx tsc --noEmit -p ../vault/tsconfig.json
      - name: Type-check webpack loaders (JSDoc, checkJs)
        run: cd modules/ui-classic && bunx tsc -p tsconfig.build.json
      - name: Type-check the service worker (WebWorker lib)
        run: cd modules/ui-classic && bunx tsc -p app/sw/tsconfig.json
      - name: Enforce baseline sentinel is still 0
        run: |
          cd modules/ui-classic
          BASELINE=$(cat .typescript-baseline | tr -d '[:space:]')
          if [ "$BASELINE" != "0" ]; then
            echo "::error title=TS baseline sentinel drifted::modules/ui-classic/.typescript-baseline must remain at 0. Got: $BASELINE. See Phase 1 TS migration closeout in 599485d9."
            exit 1
          fi

  e2e-extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - run: cd modules/extension && bun run build-chrome
      - run: cd modules/extension && bunx playwright install chromium --with-deps
      - run: sudo apt-get install -y xvfb
      - name: Extension E2E (Playwright headed + xvfb)
        run: cd modules/extension && xvfb-run bunx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-extension-report
          path: |
            modules/extension/test-results/
            modules/extension/playwright-report/
          retention-days: 7

  e2e-full-chain-chromium:
    # Full-chain autofill regression guard for Chromium. Drives the
    # COMPLETE runCommand chain via chrome.action.onClicked.dispatch
    # (a public chrome.events.Event API), including the encrypted
    # backend.getLogins round-trip that was broken by the 2026-04-09
    # nonce-aliasing bug. Runs against real github.com/login.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (webpack dev server needs kdbxweb dist)
        # modules/ui-classic webpack aliases `kdbxweb` → modules/db/dist.
        # Without this build step the dev server fails to compile with
        # "Can't resolve 'kdbxweb'" across ~20 files. Same root cause as
        # the typecheck job's missing-types issue, different layer.
        run: cd modules/db && bun run build
      - run: cd modules/extension && bun run build-chrome
      - run: bunx playwright install chromium --with-deps
      - run: sudo apt-get install -y xvfb
      - name: Full-chain chromium E2E
        run: xvfb-run bunx playwright test --config playwright.config.ts --project=extension e2e/extension/autofill-full-chain.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-full-chain-chromium-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-full-chain-firefox:
    # Full-chain autofill regression guard for Firefox. Uses Selenium
    # + geckodriver because Playwright's bundled Firefox enforces xpi
    # signature verification (our dev xpi is unsigned). Drives
    # runCommand via the `invoke-action-click` runtime message RPC
    # from the extension options page (Firefox does not expose
    # chrome.action.onClicked.dispatch like Chromium does).
    #
    # Runner: ubuntu-latest (24.04 noble) REMOVED firefox from apt
    # — only the snap is available, which doesn't work inside
    # containerized CI. We install Firefox + geckodriver via binary
    # downloads instead, which gives us a pinned Firefox version for
    # reproducibility (ci drift in browser-version would otherwise
    # surface as test flakiness).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install
      - name: Build modules/db (webpack dev server needs kdbxweb dist)
        # modules/ui-classic webpack aliases `kdbxweb` → modules/db/dist.
        # Without this the dev server fails with "Can't resolve 'kdbxweb'".
        run: cd modules/db && bun run build
      - run: cd modules/extension && bun run build-firefox
      - name: Install Firefox + geckodriver (pinned binary download)
        run: |
          set -euxo pipefail
          # Firefox — pin a specific version for CI reproducibility.
          # Update periodically in coordination with the local dev
          # environment (local runs Firefox 149).
          FIREFOX_VERSION=149.0.2
          wget -q "https://download.mozilla.org/?product=firefox-${FIREFOX_VERSION}&os=linux64&lang=en-US" -O firefox.tar.xz
          tar -xf firefox.tar.xz
          sudo mv firefox /opt/firefox
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          firefox --version
          # geckodriver — pinned release.
          GECKO_VERSION=v0.36.0
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-linux64.tar.gz" -O geckodriver.tar.gz
          tar -xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
          # Firefox deps (libdbus-glib, etc) — install what's actually
          # needed for headless Firefox on ubuntu-noble.
          sudo apt-get update
          sudo apt-get install -y libdbus-glib-1-2 libgtk-3-0 libasound2t64
      - name: Start KeeWebX dev server
        run: |
          bun run --filter @keewebx/ui-classic dev > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8085 > /dev/null; then
              echo "dev server ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Full-chain firefox E2E
        env:
          HEADLESS: '1'
          KEEWEBX_URL: http://localhost:8085/classic.html
        run: bun run e2e/extension/autofill-firefox-full-chain.mjs
      - name: Dump dev server log on failure
        if: failure()
        run: cat /tmp/dev-server.log || true

  e2e-new-interface-connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KEEWEBX_NEW_EXTENSION: '1'
      KEEWEBX_E2E_PORT: '8097'
      KW_E2E_APP_ORIGIN: http://localhost:8097
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/new-interface-connect
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build the app with New extension connections enabled
        run: bun run build
      - name: Build both extension packages
        working-directory: modules/extension
        run: |
          bun run build-chrome
          bun run build-chrome-vault
      - name: Build and typecheck Userscripts Connect
        run: |
          bun modules/extension/userscript/build-connect.ts
          bun test modules/extension/userscript/tests/site-return-path.test.ts modules/extension/userscript/tests/retired-support.test.ts
          bun test modules/extension/userscript/tests/runtime-owner.test.ts modules/extension/userscript/tests/receiver-ownership.test.ts modules/extension/userscript/tests/route-preparation.test.ts modules/extension/userscript/tests/foreground-route-failure.test.ts
          bun test modules/extension/userscript/tests/app-instance-worker.test.ts
          bun test modules/extension/userscript/tests/app-authorization-cancel.test.ts modules/extension/userscript/tests/local-connect-log.test.ts
          bun test modules/extension/userscript/tests/operation.test.ts modules/extension/userscript/tests/reply-receipt.test.ts modules/extension/userscript/tests/app-bridge-receipt.test.ts modules/extension/userscript/tests/native-hello-retry.test.ts modules/extension/userscript/tests/port-auth.test.ts modules/extension/userscript/tests/port-worker.test.ts modules/extension/userscript/tests/relay-close.test.ts modules/extension/userscript/tests/direct-ports.test.ts modules/extension/userscript/tests/native-connect.test.ts modules/extension/userscript/tests/connect-mailbox.test.ts modules/extension/userscript/tests/connector-return.test.ts modules/vault/tests/website-matching.test.ts
          modules/extension/node_modules/.bin/tsc --project modules/extension/userscript/tsconfig.json
          node --check modules/extension/userscript/keewebx-connect.user.js
          git diff --exit-code -- modules/extension/userscript/keewebx-connect.user.js
      - name: Install full headless Chromium
        run: bunx playwright install chromium --with-deps
      - name: Test real New and Classic extension connections
        run: |
          set -euo pipefail
          mkdir -p .cache
          bun e2e/serve-app.ts > .cache/new-interface-connect-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8097/next.html > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .cache/new-interface-connect-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8097/next.html > /dev/null
          KW_E2E_APP_ORIGIN=http://127.0.0.1:8097 KW_SINGLE_APP_OUTPUT=.cache/single-app node modules/ui/tests/app-instance-browser.mjs --browser=chromium
          KWX_RELAY_BROWSERS=chromium KWX_RELAY_LIFECYCLE_OUTPUT=.cache/userscript-relay-lifecycle node modules/extension/userscript/tests/relay-lifecycle.mjs
          mkdir -p .cache/userscript-connect
          LOGIN_FIELD_RESULTS=.cache/userscript-connect/login-fields.json node modules/extension/userscript/tests/login-fields.mjs chromium
          CONNECT_COMPONENT_RESULTS=.cache/userscript-connect/components.json node modules/ui-kit/tests/connect.mjs chromium
          CONNECT_DRAG_RESULTS=.cache/userscript-connect/drag.json node modules/extension/userscript/tests/connect-drag.mjs chromium
          KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-connect node modules/extension/userscript/tests/native-connect.mjs
          KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-port node modules/extension/userscript/tests/port-connect.mjs
          KWX_FOCUS_FRESH_PORT=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-fresh-port node modules/extension/userscript/tests/port-connect.mjs
          KWX_FOCUS_LIFECYCLE=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-lifecycle node modules/extension/userscript/tests/port-connect.mjs
          KWX_FOCUS_APP_REFRESH=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-app-refresh node modules/extension/userscript/tests/port-connect.mjs
          FOCUS_FOREGROUND_FAILURE=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-foreground-route node modules/extension/userscript/tests/port-connect.mjs
          KWX_FOCUS_MAILBOX_RECOVERY=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-mailbox-recovery node modules/extension/userscript/tests/port-connect.mjs
          KWX_FOCUS_RELEASED_PORT_RECOVERY=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-released-port-recovery node modules/extension/userscript/tests/port-connect.mjs
          KWX_BLOCK_HELPER_CLOSE=1 KWX_APP_GM_BLOCK=1 KWX_APP_SERVER=http://127.0.0.1:8097 KWX_E2E_OUTPUT_DIR=.cache/userscript-port-blocked node modules/extension/userscript/tests/port-connect.mjs
          FORM_GUARD_RESULTS=.cache/userscript-connect/form-guards.json node modules/extension/userscript/tests/form-guards.mjs chromium
          KWX_RELAY_REPORT=.cache/userscript-connect/relay-transport.json node modules/extension/userscript/tests/relay-transport.mjs chromium
          bunx playwright test --config e2e/extension/new-interface.playwright.config.ts e2e/extension/new-interface-connection.spec.ts --reporter=line,html
      - name: Test installed compatible client commands
        run: |
          bun e2e/extension-command-client/build.ts
          bunx playwright test --config e2e/extension-command-client/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-new-interface-connect-report
          include-hidden-files: true
          path: |
            e2e/test-results-new-extension/
            playwright-report/new-interface-connect/
            .cache/new-interface-connect-server.log
            .cache/extension-command-results/
            .cache/userscript-connect/
            .cache/userscript-relay-lifecycle/
            .cache/userscript-port/
            .cache/userscript-app-refresh/
            .cache/userscript-foreground-route/
            .cache/userscript-mailbox-recovery/
            .cache/userscript-port-blocked/
            .cache/single-app/
          retention-days: 7

  e2e-new-interface-core:
    # Full New core coverage, including database/CRUD/save regressions.
    # The matching config serves built files only and remains fully headless.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    env:
      KEEWEBX_NEW_EXTENSION: '1'
      KEEWEBX_E2E_PORT: '8112'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build both app interfaces once
        run: bun run build
      - name: Install headless browser dependencies
        run: bunx playwright install ${{ matrix.browser }} --with-deps
      - name: Verify New startup updates
        if: matrix.shard == 1
        env:
          KEEWEBX_E2E_PORT: '8112'
          KW_E2E_APP_ORIGIN: http://127.0.0.1:8112
          KW_STARTUP_UPDATE_OUTPUT: .cache/startup-update/${{ matrix.browser }}
        run: |
          set -euo pipefail
          mkdir -p "$KW_STARTUP_UPDATE_OUTPUT"
          bun e2e/serve-app.ts > "$KW_STARTUP_UPDATE_OUTPUT/server.log" 2>&1 &
          startup_server=$!
          trap 'kill "$startup_server" 2>/dev/null || true; wait "$startup_server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$KW_E2E_APP_ORIGIN/next.html" > /dev/null; then break; fi
            if ! kill -0 "$startup_server" 2>/dev/null; then cat "$KW_STARTUP_UPDATE_OUTPUT/server.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error "$KW_E2E_APP_ORIGIN/next.html" > /dev/null
          node modules/ui/tests/startup-update-browser.mjs --browser=${{ matrix.browser }}
          KW_LOCAL_HTML_BROWSERS=${{ matrix.browser }} node scripts/smoke-local-html-network.mjs > "$KW_STARTUP_UPDATE_OUTPUT/local-html-network.json"
      - name: Verify local HTML WebDAV persistence
        if: matrix.shard == 1
        env:
          KW_LOCAL_HTML_ENTRY: file://${{ github.workspace }}/dist/next.html
        run: bunx playwright test --config e2e/core-ci.playwright.config.ts --project=new-${{ matrix.browser }} e2e/core/next-webdav.spec.ts --grep 'preserves the original remote file on HTTP write failure' --workers=1
      - name: Run New core suite
        run: bunx playwright test --config e2e/core-ci.playwright.config.ts --project=new-${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-new-core-${{ matrix.browser }}-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            e2e/test-results-core-ci/
            playwright-report/core-ci/
            .cache/startup-update/${{ matrix.browser }}/
          retention-days: 7

  e2e-classic-interface-core:
    # Full Classic core coverage, including database/CRUD/save regressions.
    # The matching config serves built files only and remains fully headless.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      KEEWEBX_NEW_EXTENSION: '1'
      KEEWEBX_E2E_PORT: '8112'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Build both app interfaces once
        run: bun run build
      - name: Install headless browser dependencies
        run: bunx playwright install ${{ matrix.browser }} --with-deps
      - name: Run Classic core suite
        run: bunx playwright test --config e2e/core-ci.playwright.config.ts --project=classic-${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-classic-core-${{ matrix.browser }}
          path: |
            e2e/test-results-core-ci/
            playwright-report/core-ci/
          retention-days: 7

  e2e-messageport-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build the complete client assets for production WebKit acceptance
        run: bun run build
      - run: bunx playwright install webkit --with-deps
      - name: Test isolated WebKit handoff with delayed extension storage
        env:
          KWX_PORT_POC_BROWSER: webkit
          KWX_PORT_POC_GM_DELAY_MS: '12000'
          KWX_PORT_POC_OUTPUT: .cache/messageport-webkit
        run: |
          set -euo pipefail
          mkdir -p .cache/messageport-webkit/commands
          run_check() {
            local name="$1"
            shift
            local log=".cache/messageport-webkit/commands/$name.log"
            if timeout 180 node "$@" 2>&1 | tee "$log"; then return 0; fi
            node --input-type=module - "$log" <<'NODE'
          import { readFileSync } from 'node:fs';
          const file = process.argv[2];
          const tail = readFileSync(file, 'utf8').slice(-2400).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          process.stdout.write('::error title=WebKit command ' + file + '::' + tail + '\n');
          NODE
            return 1
          }
          failed=0
          KEEWEBX_E2E_PORT=8159 bun e2e/serve-app.ts > .cache/messageport-webkit/single-app-server.log 2>&1 &
          instance_server=$!
          trap 'kill "$instance_server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8159/next.html > /dev/null; then break; fi
            if ! kill -0 "$instance_server" 2>/dev/null; then cat .cache/messageport-webkit/single-app-server.log; exit 1; fi
            sleep 1
          done
          KW_E2E_APP_ORIGIN=http://127.0.0.1:8159 KW_SINGLE_APP_OUTPUT=.cache/messageport-webkit/single-app run_check single-app modules/ui/tests/app-instance-browser.mjs --browser=webkit || failed=1
          KW_E2E_APP_ORIGIN=http://127.0.0.1:8159 KW_STARTUP_UPDATE_OUTPUT=.cache/messageport-webkit/startup-update run_check startup-update modules/ui/tests/startup-update-browser.mjs --browser=webkit || failed=1
          KW_LOCAL_HTML_BROWSERS=webkit run_check local-html-network scripts/smoke-local-html-network.mjs || failed=1
          LOGIN_FIELD_RESULTS=.cache/messageport-webkit/login-fields.json run_check login-fields modules/extension/userscript/tests/login-fields.mjs webkit || failed=1
          CONNECT_COMPONENT_RESULTS=.cache/messageport-webkit/components.json run_check components modules/ui-kit/tests/connect.mjs webkit || failed=1
          CONNECT_DRAG_RESULTS=.cache/messageport-webkit/drag.json run_check drag modules/extension/userscript/tests/connect-drag.mjs webkit || failed=1
          KWX_RELAY_BROWSERS=webkit KWX_RELAY_LIFECYCLE_OUTPUT=.cache/messageport-webkit/lifecycle run_check lifecycle modules/extension/userscript/tests/relay-lifecycle.mjs || failed=1
          KWX_BLOCK_HELPER_CLOSE=1 KWX_WEBKIT_OUTPUT=.cache/messageport-webkit/production run_check production modules/extension/userscript/tests/port-connect-webkit.mjs || failed=1
          KWX_WEBKIT_LIFECYCLE=1 KWX_WEBKIT_OUTPUT=.cache/messageport-webkit/operation-lifecycle run_check operation-lifecycle modules/extension/userscript/tests/port-connect-webkit.mjs || failed=1
          exit "$failed"
      - name: Explain a failed WebKit acceptance report
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = '.cache/messageport-webkit';
          if (existsSync(root)) for (const file of readdirSync(root, { recursive: true })) {
            if (!file.endsWith('report.json')) continue;
            const report = JSON.parse(readFileSync(join(root, file), 'utf8'));
            if (report.passed === true) continue;
            const message = JSON.stringify({ report: file, failure: report.failure, steps: report.steps }).slice(0, 3000)
              .replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            process.stdout.write('::error title=WebKit acceptance report::' + message + '\n');
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: messageport-webkit
          include-hidden-files: true
          path: .cache/messageport-webkit/
          retention-days: 7
