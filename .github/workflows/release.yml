name: Release self-host bundle

# Produces a static-site tarball + zip users can drop onto any HTTP server
# (nginx, Caddy, S3+CF, GitHub Pages, `python3 -m http.server`, ...). This is
# the "I don't want to use keewebx.app, I want to host it myself"
# artifact. Contains both interfaces without hosted-service overlays.
#
# Triggers:
#   - push of a tag `v*`   -> attach archives to the matching GitHub Release
#   - workflow_dispatch    -> upload as workflow artifact (testable without a tag)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/upload GitHub Releases

jobs:
  build-and-package:
    # Skip extension-specific tags (`v*-extension`). Those are handled by
    # release-extension.yml which builds Chrome/Firefox/Edge packages from
    # modules/extension/. GitHub Actions tag filters don't support
    # negation (e.g., `tags-ignore: 'v*-extension'` combined with
    # `tags: 'v*'` is ignored), so we gate at the job level instead. On
    # workflow_dispatch github.ref_name is the branch, which never matches.
    if: ${{ !endsWith(github.ref_name, '-extension') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so we can resolve the previous tag and
          # diff commit messages between $PREV_TAG..$NEW_TAG for the
          # release notes "What's new" section.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check build source resolution
        run: bun test scripts/tests/build-entries.test.ts

      - name: Build database and both interfaces
        run: bun run build
        env:
          # Pin the build's embedded commit SHA to the CI commit so the
          # live-demo drift check in deploy-pages.yml stays consistent.
          GITHUB_SHA: ${{ github.sha }}
          KEEWEBX_NEW_EXTENSION: "1"

      - name: Verify static assets present in dist
        run: |
          set -e
          cd dist
          test -f index.html
          test -f classic.html
          test -f classic/index.html
          test -f manifest-classic.json
          test -f manifest-new.json
          test -f js/app.js
          test -f css/app.css
          test -f next.html
          test -f js/next.js
          test -f css/next.css
          test -s LICENSE
          test -s THIRD-PARTY-LICENSES.md
          test -f manifest.json
          test -f browserconfig.xml
          test -f icons/favicon-32x32.png
          test -f icons/apple-touch-icon.png
          test -f icons/safari-pinned-tab.svg
          echo "All required static assets present."

      - name: Verify build SHA injected into bundle
        run: |
          set -e
          cd dist
          for bundle in js/app.js js/next.js; do
            grep -q "${GITHUB_SHA}" "$bundle" \
              || { echo "::error::build SHA missing from $bundle"; exit 1; }
          done
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Compute version label
        id: version
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version label: ${VERSION}"

      - name: Package both interfaces as zip and tar.gz
        id: pack
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/package-web.mjs "$VERSION" artifacts
          echo "base=keewebx-web-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify and smoke the actual extracted archive
        run: |
          set -euo pipefail
          BASE="${{ steps.pack.outputs.base }}"
          (cd artifacts && sha256sum -c "${BASE}.zip.sha256" && sha256sum -c "${BASE}.tar.gz.sha256")
          unzip -tq "artifacts/${BASE}.zip"
          mkdir -p unpacked/zip unpacked/tar
          unzip -q "artifacts/${BASE}.zip" -d unpacked/zip
          tar -xzf "artifacts/${BASE}.tar.gz" -C unpacked/tar
          diff -qr "unpacked/zip/${BASE}" "unpacked/tar/${BASE}"
          bunx playwright install --with-deps chromium
          node scripts/smoke-artifact.mjs "unpacked/zip/${BASE}" > artifacts/smoke-zip.json
          node scripts/smoke-artifact.mjs "unpacked/tar/${BASE}" > artifacts/smoke-tar.json

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: keewebx-web-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/smoke-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Compose release notes body (tag push only)
        # Build a friendlier release body than softprops's default
        # "**Full Changelog**: ...compare/..." one-liner. Sections:
        #   - Live demo link at top
        #   - "What's new" — commit subjects between PREV_TAG..NEW_TAG,
        #     skipping merges, deduped
        #   - Self-host pointer to the attached zip/tar.gz
        #   - Full Changelog link (auto-resolved to previous tag)
        # If there is no previous tag (first release ever), the diff
        # falls back to "since beginning" and we omit the compare link.
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          set -euo pipefail
          NEW_TAG="${GITHUB_REF_NAME}"
          BASE="${{ steps.pack.outputs.base }}"
          # Previous non-extension v* tag, sorted by version. `git tag
          # --sort=-v:refname` lists newest first; we exclude the current
          # tag and any -extension variant.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -v -- '-extension$' \
            | grep -v -Fx "${NEW_TAG}" \
            | head -n1 || true)
          echo "Previous tag: ${PREV_TAG:-<none>}"
          echo "Current tag:  ${NEW_TAG}"

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${NEW_TAG}"
          else
            # First release — log everything reachable from NEW_TAG.
            RANGE="${NEW_TAG}"
          fi

          # Commit subjects: skip merges, drop empty lines, dedupe
          # while preserving order.
          CHANGES=$(git log "${RANGE}" --no-merges --pretty=format:'%s' \
            | awk 'NF && !seen[$0]++' \
            | sed 's/^/- /')

          if [ -z "${CHANGES}" ]; then
            CHANGES="- (no commit messages between ${PREV_TAG:-start} and ${NEW_TAG})"
          fi

          {
            echo "## Live"
            echo ""
            echo "→ https://keewebx.app/demo"
            echo ""
            echo "## What's new"
            echo ""
            echo "${CHANGES}"
            echo ""
            echo "## Self-host"
            echo ""
            echo "Download \`${BASE}.zip\` or \`${BASE}.tar.gz\` below, extract,"
            echo "and double-click \`index.html\` (or serve the folder from any static"
            echo "HTTP server). \`.sha256\` checksums are attached for verification."
            echo "See the bundled \`DEPLOY.md\` for the full self-host guide."
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${NEW_TAG}"
            fi
          } > release-body.md

          echo "::group::Composed release body"
          cat release-body.md
          echo "::endgroup::"

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/${{ steps.pack.outputs.base }}.zip
            artifacts/${{ steps.pack.outputs.base }}.zip.sha256
            artifacts/${{ steps.pack.outputs.base }}.tar.gz
            artifacts/${{ steps.pack.outputs.base }}.tar.gz.sha256
          body_path: release-body.md
          # generate_release_notes intentionally omitted: we build the
          # body ourselves above. Leaving it on would append softprops's
          # auto-summary AFTER our body, doubling content.
          fail_on_unmatched_files: true
