name: Release standalone Userscripts Connect

on:
  push:
    tags: ['userscript-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable userscript-vX.Y.Z tag to package'
        type: string
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build and check the exact committed installer
        run: |
          bun modules/extension/userscript/build-connect.ts
          bun test modules/extension/userscript/tests/site-return-path.test.ts modules/extension/userscript/tests/retired-support.test.ts
          bun test modules/extension/userscript/tests/runtime-owner.test.ts modules/extension/userscript/tests/receiver-ownership.test.ts
          bun test modules/extension/userscript/tests/route-preparation.test.ts modules/extension/userscript/tests/foreground-route-failure.test.ts modules/extension/userscript/tests/app-instance-worker.test.ts
          bun test modules/extension/userscript/tests/operation.test.ts modules/extension/userscript/tests/reply-receipt.test.ts modules/extension/userscript/tests/app-bridge-receipt.test.ts modules/extension/userscript/tests/native-hello-retry.test.ts modules/extension/userscript/tests/port-auth.test.ts modules/extension/userscript/tests/port-worker.test.ts modules/extension/userscript/tests/relay-close.test.ts modules/extension/userscript/tests/direct-ports.test.ts modules/extension/userscript/tests/native-connect.test.ts modules/extension/userscript/tests/connect-mailbox.test.ts modules/extension/userscript/tests/connector-return.test.ts modules/vault/tests/website-matching.test.ts
          modules/extension/node_modules/.bin/tsc --project modules/extension/userscript/tsconfig.json
          node --check modules/extension/userscript/keewebx-connect.user.js
          git diff --exit-code -- modules/extension/userscript/keewebx-connect.user.js
      - name: Build database for app policy tests
        run: bun run --filter @keewebx/db build
      - name: Check app-side queue lifecycle and website scope enforcement
        working-directory: modules/ui-classic
        run: |
          bun test tests/comp/extension/protocol-impl.test.ts
          bun test tests/comp/extension/website-protocol.test.ts
      - name: Verify release version and package
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^userscript-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#userscript-v}"
          ACTUAL=$(awk '/^\/\/ @version / {print $3; exit}' modules/extension/userscript/keewebx-connect.user.js)
          test "$ACTUAL" = "$VERSION"
          mkdir -p artifacts
          cp modules/extension/userscript/keewebx-connect.user.js artifacts/
          cd artifacts
          sha256sum keewebx-connect.user.js > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_TAG }}
          path: artifacts/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/keewebx-connect.user.js
            artifacts/SHA256SUMS.txt
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
